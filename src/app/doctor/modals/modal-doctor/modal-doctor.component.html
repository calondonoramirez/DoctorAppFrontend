<h2 mat-dialog-title> {{title}} Medico</h2>
<mat-dialog-content>

    <form [formGroup]="formDoctor">
        <div class="row mt-2">
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Name</mat-label>
                    <input formControlName="name" matInput autocomplete="off" maxlength="60">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Last Name</mat-label>
                    <input formControlName="lastName" matInput autocomplete="off" maxlength="60">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Direction</mat-label>
                    <input formControlName="direction" matInput autocomplete="off" maxlength="100">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Phone</mat-label>
                    <input formControlName="phone" matInput autocomplete="off" maxlength="40">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Genre</mat-label>
                    <mat-select formControlName="genre">
                        <mat-option value="M">Masculino</mat-option>
                        <mat-option value="F">Femenino</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Speciality</mat-label>
                    <mat-select formControlName="specialityId">
                        <mat-option *ngFor="let item of specialitylist" [value]="item.id">
                            {{item.specialityName}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>State</mat-label>
                    <mat-select formControlName="state">
                        <mat-option value="1">Activo</mat-option>
                        <mat-option value="0">Inactivo</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close="true" color="warn">Back</button>
    
    <button mat-raised-button color="primary" [disabled]="formDoctor.invalid" (click)="CreateModifyDoctor()">
        {{buttonName}}
    </button>
</mat-dialog-actions>
