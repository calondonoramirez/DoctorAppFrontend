<h1 class="m-2">Specialities</h1>
<div class="content">
    <mat-card class="m-2">
        <mat-card-title>
          <button mat-raised-button color="primary" (click)="specialityNew()" class="m-2">
            <mat-icon mat-list-icon>add</mat-icon>New
          </button>
        </mat-card-title>
        <mat-divider></mat-divider>

        <mat-card-content class="mt-2">

          <mat-form-field style="width: 100%">
            <mat-label>Search</mat-label>
            <input matInput (keyup)="applyFilterList($event)" placeholder="Filtro" #input>
          </mat-form-field>

            <div class="mat-elevation-z8" style="overflow-x: auto;">
                <table mat-table [dataSource]="dataSource">
                                
                  <ng-container matColumnDef="specialityName">
                    <th mat-header-cell *matHeaderCellDef> Speciality Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.specialityName}} </td>
                  </ng-container>

                  <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> Description </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                  </ng-container>

                  <ng-container matColumnDef="state">
                    <th mat-header-cell *matHeaderCellDef> State </th>
                    <td mat-cell *matCellDef="let element"> {{element.state == 1 ? 'Activo' : 'Inactivo'}} </td>
                  </ng-container>

                  <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">  
                      <button mat-icon-button color="primary" (click)="specialityUpdate(element)">
                        <mat-icon>edit</mat-icon>
                      </button>
                      <button mat-icon-button color="warn" (click)="specialityRemove(element)">
                        <mat-icon>delete</mat-icon>
                      </button>
                    </td>
                  </ng-container>                
                                
              
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="4">No hay datos que coincidan con el filtro "{{input.value}}"</td>
                  </tr>

                </table>
              
                <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                               showFirstLastButtons
                               aria-label="Select speciality">
                </mat-paginator>
              </div>
              

        </mat-card-content>
    </mat-card>

</div>
