<h2 mat-dialog-title>{{title}} User</h2>

<mat-dialog-content>

    <form [formGroup]="formUser">
        <div class="row mt-2">
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>userName</mat-label>
                    <input formControlName="userName" matInput autocomplete="off">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Password</mat-label>
                    <input formControlName="password" matInput autocomplete="off" type="password">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Name</mat-label>
                    <input formControlName="name" matInput autocomplete="off">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Last Name</mat-label>
                    <input formControlName="lastName" matInput autocomplete="off">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Email</mat-label>
                    <input formControlName="email" matInput autocomplete="off"
                    type="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$">
                    <div *ngIf="email?.touched">
                        <p *ngIf="email?.errors?.['pattern']">Email no valido</p>
                    </div>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Role</mat-label>
                    <mat-select formControlName="role">
                        <mat-option *ngFor="let item of roleList" [value]="item.roleName">
                            {{item.roleName}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close="true" color="warn">Back</button>
    
    <button mat-raised-button color="primary" [disabled]="formUser.invalid" (click)="registerUser()">
        {{buttonName}}
    </button>
</mat-dialog-actions>
